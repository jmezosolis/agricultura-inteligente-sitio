name: Actualizar clima por estado

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, al minuto 7
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    # Solo corre en el repositorio público del sitio (el privado no lo necesita)
    if: github.repository == 'jmezosolis/agricultura-inteligente-sitio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar pronóstico de los 126 puntos
        run: node scripts/actualizar-clima.mjs
      - name: Guardar si cambió
        run: |
          git config user.name "actualizacion-clima"
          git config user.email "actions@users.noreply.github.com"
          git add potreros/mapa-alertas/clima-estados.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar clima por estado"
            git push
          fi
